name: Generate Snake Animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: capf01
          outputs: |
            dist/snake-color.svg
            dist/snake-neon.svg?palette=github-dark&color_snake=#00C2A3&color_dots=#0A1F44,#123C69,#00C2A3,#26FFE6,#FFFFFF
            dist/snake-galaxy.svg?palette=github-dark&color_snake=#B026FF&color_dots=#0A0F2C,#1B1F5C,#4B0082,#8A2BE2,#00C2FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
